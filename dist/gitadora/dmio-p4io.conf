# dmio-p4io runtime config
#
# Use this file to tune mapping on real hardware without recompiling.
#
# Path usage:
#   dmio-p4io.dll --dmio-p4io-config dist/gitadora/dmio-p4io.conf
#
# Notes:
# - Bit indices are JAMMA bit positions in jamma[0], range 0..31.
# - P4IO DrumMania pad lines are usually active-low.
# - System lines are usually active-high.

# ------------------------------
# Pad mappings (drums)
# ------------------------------
dmio.p4io.pad.left_cymbal_bit=0
dmio.p4io.pad.hihat_bit=1
dmio.p4io.pad.left_pedal_bit=8
dmio.p4io.pad.snare_bit=2
dmio.p4io.pad.hi_tom_bit=3
dmio.p4io.pad.bass_pedal_bit=7
dmio.p4io.pad.low_tom_bit=4
dmio.p4io.pad.floor_tom_bit=5
dmio.p4io.pad.right_cymbal_bit=6

# ------------------------------
# System mappings
# ------------------------------
dmio.p4io.sys.service_bit=25
dmio.p4io.sys.test_bit=24
dmio.p4io.sys.coin_bit=28
dmio.p4io.sys.start_bit=16
dmio.p4io.sys.up_bit=17
dmio.p4io.sys.down_bit=18
dmio.p4io.sys.left_bit=19
dmio.p4io.sys.right_bit=20
dmio.p4io.sys.help_bit=21
dmio.p4io.sys.extra1_bit=22
dmio.p4io.sys.extra2_bit=23

# ------------------------------
# Filtering/reliability
# ------------------------------
# Consecutive polls required to commit bit state changes (range: 1..10)
dmio.p4io.pad.debounce_threshold=2
dmio.p4io.sys.debounce_threshold=2

# Allowed consecutive p4iodrv_read_jamma failures before read returns false
# (range: 0..255)
dmio.p4io.max_read_fail_streak=5

# ------------------------------
# Polarity/debug
# ------------------------------
dmio.p4io.pad.active_high=false
dmio.p4io.sys.active_high=true

# Set true to print jamma[0] every poll for mapping sessions
dmio.p4io.log_jamma=false
